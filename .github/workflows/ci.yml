name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 后端：语法检查（启动需要 .env/JWT_SECRET，CI 只做静态检查）
      - name: Server syntax check
        run: find server scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      # 前端：单测 + 构建
      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Client unit tests
        working-directory: client
        run: npx vitest run

      - name: Client build
        working-directory: client
        run: npx vite build
